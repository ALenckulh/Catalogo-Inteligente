name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      - name: Test + Jacoco gate
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload Jacoco XML
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run test:coverage

      - name: Upload LCOV
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  sonar:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      - name: Compile backend (Sonar binaries)
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew classes --no-daemon

      - name: Download Jacoco XML
        uses: actions/download-artifact@v4
        with:
          name: jacoco-xml
          path: backend/build/reports/jacoco/test

      - name: Download LCOV
        uses: actions/download-artifact@v4
        with:
          name: lcov
          path: frontend/coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
