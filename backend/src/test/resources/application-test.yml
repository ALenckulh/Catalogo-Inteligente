spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

catalogo:
  rabbit:
    enabled: false
  rate-limit:
    enabled: false
  jwt:
    secret: test-only-catalogo-jwt-secret-key-32b!!
    expiration-ms: 3600000
