spring:
  application:
    name: catalogo-backend
  profiles:
    active: dev
  jpa:
    # Sessão do Hibernate fecha no fim do service: nada de lazy loading escondido no controller
    # (as queries usam JOIN FETCH quando precisam das relações).
    open-in-view: false
    hibernate:
      # Hibernate não cria nem altera tabelas: o schema é do Flyway (database/migrations).
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          # Instantes gravados em UTC (TIMESTAMPTZ ↔ OffsetDateTime); o front converte para o horário local.
          time_zone: UTC
  flyway:
    # A aplicação não roda migrations (ADR-B04): elas rodam pelo container flyway do docker compose.
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
