sonar.projectKey=ALenckulh_Catalogo-Inteligente
sonar.organization=alenckulh
sonar.projectName=Catalogo-Inteligente

sonar.sources=backend/src/main,frontend
sonar.tests=backend/src/test,frontend
sonar.test.inclusions=backend/src/test/**/*,frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/**/*.spec.ts,frontend/**/*.spec.tsx

sonar.sourceEncoding=UTF-8

sonar.java.binaries=backend/build/classes/java/main
sonar.java.libraries=backend/build/libs/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/build/**,\
  **/dto/**,\
  **/entity/**,\
  **/mapper/**,\
  **/repository/**,\
  **/config/SecurityConfig.java,\
  **/config/RabbitConfig.java,\
  **/config/CorsConfig.java,\
  **/config/JacksonConfig.java,\
  **/config/JpaAuditingConfig.java,\
  **/CatalogoApplication.java,\
  frontend/lib/mocks/**,\
  frontend/public/**

sonar.coverage.exclusions=\
  **/dto/**,\
  **/entity/**,\
  **/mapper/**,\
  **/repository/**,\
  **/config/SecurityConfig.java,\
  **/config/RabbitConfig.java,\
  **/config/CorsConfig.java,\
  **/config/JacksonConfig.java,\
  **/config/JpaAuditingConfig.java,\
  **/CatalogoApplication.java,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx
